[workspace]
resolver = "3"
members = ["crates/logfold-core", "crates/logfold-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/arnavsx3/logfold"
readme = "README.md"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
logfold-core = { path = "crates/logfold-core", version = "0.1.0" }
regex = "1.13.1"
